# Minimal CF app whose only purpose is to be a target for ``cf ssh``,
# so an operator on a developer workstation can tunnel through the BTP
# connectivity proxy (which is only reachable from inside the CF
# runtime).  Total cost: 64 MB of memory in your subaccount.
#
# Used by the SAPMAP PP-impersonation live probe.  See
# tools/btp_ssh_bridge/README.md for the operational recipe.
---
applications:
  - name:         sapmap-probe-bridge
    instances:    1
    memory:       64M
    buildpacks:
      - staticfile_buildpack
    # Let CF mint a random hostname under the default shared domain
    # for this org/space.  Avoids name collisions when multiple
    # operators push this app concurrently in the same subaccount,
    # and is supported across every CF API version we care about.
    random-route: true
