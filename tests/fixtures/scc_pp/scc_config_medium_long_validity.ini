<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<commonConfigData>
    <principalPropagationConfiguration>
        <subjectPatterns>
            <subjectPattern>
                <dnEntries>
                    <entry>
                        <key>CN</key>
                        <value>${user_uuid}</value>
                    </entry>
                    <entry>
                        <key>OU</key>
                        <value>HR</value>
                    </entry>
                </dnEntries>
                <condition>${email_domain} == 'acme.example.com'</condition>
            </subjectPattern>
        </subjectPatterns>
        <certificateValidityPeriodInMins>1440</certificateValidityPeriodInMins>
        <principalPropagationMode>LOCAL</principalPropagationMode>
        <ssoToleranceInHours>24</ssoToleranceInHours>
    </principalPropagationConfiguration>
</commonConfigData>
